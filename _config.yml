# GitHub Pages (Jekyll) build config.
#
# Sole purpose: keep internal project docs (and, temporarily, passed events)
# out of the *published* site. These stay in the repo (and on github.com) —
# they're just not copied into the build, so they're not served from
# cherylfordro.com.
exclude:
  - HANDOFF.md
  - README.md
  # August 30 Meet & Greet passed (added 2026-08-28) — remove this line to
  # republish /events/ once the page is updated for the next event.
  - events
